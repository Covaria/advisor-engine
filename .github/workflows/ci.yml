name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,llm,ui]"
      # Mock mode and no key: the suite must never reach the real API.
      - run: pytest -q
        env:
          ADVISOR_LLM: mock
          ANTHROPIC_API_KEY: ""
